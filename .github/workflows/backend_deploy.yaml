name: Deploy Backend

on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  # 新增调试 job 查看sql文件位置
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Debug Project Structure
        run: |
          echo "=== Project Structure ==="
          echo "Root:"
          ls -la
          echo ""
          echo "worker/:"
          ls -la worker/ || echo "worker/ not found"
          echo ""
          echo "frontend/:"
          ls -la frontend/ || echo "frontend/ not found"
          echo ""
          echo "All .sql files:"
          find . -name "*.sql" -type f
          echo ""
          echo "All migrations:"
          find . -type d -name "migrations"
          echo ""
          echo "worker/package.json:"
          cat worker/package.json 2>/dev/null | head -50 || echo "not found"
          echo ""
          echo "GitHub Variables:"
          echo "D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME || 'NOT SET' }}"
          echo "BACKEND_TOML: ${{ vars.BACKEND_TOML || 'NOT SET' }}"
  # 原有的 deploy job
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        id: pnpm-install
        with:
          version: 10
          run_install: false

      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          export use_worker_assets=${{ secrets.USE_WORKER_ASSETS }}
          export use_worker_assets_with_telegram=${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          
          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            if [ -n "$use_worker_assets_with_telegram" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi

          export debug_mode=${{ vars.DEBUG_MODE }}
          export use_mail_wasm_parser=${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          
          cd worker/
          # ✅ 修复核心：使用环境变量写入，避免 Shell 解析特殊字符
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml
          
          pnpm install --no-frozen-lockfile

          # ==========================================
          # ✅ 数据库建表/迁移
          # ==========================================
          echo "📦 Running D1 database migrations..."
          
          # 检查 schema.sql 是否存在
          if [ -f "db/schema.sql" ]; then
            echo "Found db/schema.sql, executing..."
            npx wrangler d1 execute "$D1_DATABASE_NAME" \
              --file=db/schema.sql \
              --remote
          elif [ -d "migrations" ]; then
            echo "Found migrations directory, applying..."
            npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote
          else
            echo "⚠️  No schema file found, skipping migration"
          fi
          
          # 验证表是否创建成功
          echo "🔍 Verifying tables..."
          npx wrangler d1 execute "$D1_DATABASE_NAME" \
            --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';" \
            --remote || echo "⚠️  Table verification failed, but continuing..."

          if [ -n "$use_mail_wasm_parser" ]; then
            echo "Using mail-parser-wasm-worker"
            pnpm add mail-parser-wasm-worker
            git apply ../.github/config/mail-parser-wasm-worker.patch
            echo "Applied mail-parser-wasm-worker patch"
          fi

          if [ "$debug_mode" = "true" ]; then
            pnpm run deploy
          else
            if pnpm run deploy >/dev/null 2>&1; then
              echo "Deploy succeeded"
            else
              code=$?
              echo "Command failed with exit code $code"
              exit "$code"
            fi
          fi
          echo "Deployed for tag ${{ github.ref_name }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # ✅ 将 variables 映射到环境变量中
          WRANGLER_TOML_CONTENT: ${{ vars.BACKEND_TOML }}
          D1_DATABASE_NAME: email
